name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "infra/ecs/task-definition.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::994788128567:role/github-actions-deploy
  ECR_REPOSITORY: team-task-tracker-api
  ECS_CLUSTER: team-task-tracker
  ECS_SERVICE: api
  CONTAINER_NAME: api

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t api:ci server

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8080:8080 -e DATABASE_URL=postgres://ci:ci@localhost:5432/ci -e DB_SSL=false api:ci
          sleep 3
          if ! curl --retry 10 --retry-all-errors --retry-delay 2 -fsS http://localhost:8080/health; then
            echo "Health check failed. Container logs:"
            docker logs api
            exit 1
          fi
          docker rm -f api

      - name: Sign in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image tagged with the commit SHA
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          docker tag api:ci "$IMAGE"
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Put the new image into the task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}
          environment-variables: APP_VERSION=${{ github.sha }}

      - name: Deploy to ECS and wait until healthy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
